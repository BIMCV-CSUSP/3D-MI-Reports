<!DOCTYPE html>
<html lang="es">
<head>
	<meta charset="utf-8"/>
	<title>Informe 3D del cerebro · 3D MI Reports</title>
	<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
	<meta name="description" content="Informe 3D interactivo de un cerebro: superficie cortical, tumor y edema segmentados a partir de resonancia magnética.">
	<link rel="stylesheet" href="../assets/theme.css">
</head>
<body class="viewer-body">
	<!-- Aura background: layers blend against the body colour -->
	<div class="aura" aria-hidden="true">
		<div class="aura-layer-1"></div>
		<div class="aura-layer-2"></div>
		<div class="aura-layer-3"></div>
	</div>

	<!-- WebGL canvas host -->
	<div id="viewer"></div>

	<header class="viewer-header">
		<a class="home" href="../index.html" data-i18n-title="portalTitle">
			<svg viewBox="0 0 24 24"><path d="M15 5l-7 7 7 7"/></svg><span data-i18n="portal">Portal</span>
		</a>
		<div class="viewer-title">
			<span class="eyebrow">3D MI Reports</span>
			<h1 data-i18n="title">Informe 3D del cerebro</h1>
		</div>
		<div id="lang-switch"></div>
	</header>

	<button id="panel-toggle" class="btn panel-toggle" type="button" aria-controls="panel" aria-expanded="true" hidden></button>

	<aside id="panel" class="panel" aria-label="Controls">
		<div class="panel-head">
			<h2 data-i18n="controls">Controles</h2>
			<button id="panel-close" class="btn" type="button"><span data-i18n="hide">Ocultar</span> <kbd>H</kbd></button>
		</div>
		<div id="panel-body" class="panel-scroll"></div>
	</aside>

	<div id="toolbar" class="toolbar" role="toolbar"></div>

	<div class="hint" data-i18n="hint"></div>

	<footer class="viewer-footer">
		<div class="brand-bar">
			<img src="../assets/logos-white.png" alt="Generalitat Valenciana · Fundació Fisabio · Imagen Biomédica e IA">
		</div>
	</footer>

	<div id="pick-tip" class="pick-tip" role="status" aria-live="polite"></div>

	<div id="loading" class="loading" role="status" aria-live="polite">
		<div class="loading-card">
			<div class="spinner" aria-hidden="true"></div>
			<div class="title" data-i18n="loading">Cargando el cerebro…</div>
			<div id="loading-status" class="status">…</div>
			<div class="bar"><div id="loading-bar"></div></div>
			<div id="loading-error" class="error"></div>
		</div>
	</div>

	<script src="webgl/lib/three.js"></script>
	<script src="webgl/lib/controls/OrbitControls.js"></script>
	<script src="webgl/lib/VTKLoader.js"></script>
	<script src="../assets/i18n.js"></script>
	<script src="../assets/mi-viewer.js"></script>
	<script src="app.js"></script>
</body>
</html>
