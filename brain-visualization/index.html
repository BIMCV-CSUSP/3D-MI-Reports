<!DOCTYPE html>
<html lang="en">
<head>
	<meta charset="utf-8"/>
	<title>Brain 3D Report · 3D MI Reports</title>
	<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
	<meta name="description" content="Interactive 3D report of a brain tumour case: cortical surface, tumour and peritumoural edema segmented from MRI.">
	<link rel="stylesheet" href="../assets/theme.css">
</head>
<body class="viewer-body">
	<!-- Aura background: layers blend against the body colour -->
	<div class="aura" aria-hidden="true">
		<div class="aura-layer-1"></div>
		<div class="aura-layer-2"></div>
		<div class="aura-layer-3"></div>
	</div>

	<!-- WebGL canvas host -->
	<div id="viewer"></div>

	<header class="viewer-header">
		<a class="home" href="../index.html" title="Back to the portal">
			<svg viewBox="0 0 24 24"><path d="M15 5l-7 7 7 7"/></svg>Portal
		</a>
		<div class="viewer-title">
			<span class="eyebrow">3D MI Reports</span>
			<h1>Brain 3D Report</h1>
		</div>
	</header>

	<button id="panel-toggle" class="btn panel-toggle" type="button" aria-controls="panel" aria-expanded="true" hidden>Structures</button>

	<aside id="panel" class="panel" aria-label="Viewer controls">
		<div class="panel-head">
			<h2>Controls</h2>
			<button id="panel-close" class="btn" type="button" aria-label="Hide panel">Hide <kbd>H</kbd></button>
		</div>
		<div id="panel-body" class="panel-scroll"></div>
	</aside>

	<div id="toolbar" class="toolbar" role="toolbar" aria-label="Viewer actions"></div>

	<div class="hint">Drag to rotate · Scroll to zoom · Right-drag to pan · Click a structure to highlight · <kbd>1</kbd>–<kbd>6</kbd> views</div>

	<footer class="viewer-footer">
		<div class="brand-bar">
			<img src="../assets/logos-white.png" alt="Generalitat Valenciana · Fundació Fisabio · Imagen Biomédica e IA">
		</div>
	</footer>

	<div id="pick-tip" class="pick-tip" role="status" aria-live="polite"></div>

	<div id="loading" class="loading" role="status" aria-live="polite">
		<div class="loading-card">
			<div class="spinner" aria-hidden="true"></div>
			<div class="title">Loading brain surfaces</div>
			<div id="loading-status" class="status">…</div>
			<div class="bar"><div id="loading-bar"></div></div>
			<div id="loading-error" class="error"></div>
		</div>
	</div>

	<script src="webgl/lib/three.js"></script>
	<script src="webgl/lib/controls/OrbitControls.js"></script>
	<script src="webgl/lib/VTKLoader.js"></script>
	<script src="../assets/mi-viewer.js"></script>
	<script src="app.js"></script>
</body>
</html>
