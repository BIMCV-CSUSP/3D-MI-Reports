<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Free surfer statistic visualizations</title>
    <script src="lib/d3.v4.min.js"></script>

    <link rel="stylesheet" href="../../assets/theme.css">
    <link rel="stylesheet" type="text/css" href="index.css">

</head>
<body>
    <!-- Aura background + brand chrome (shared theme) -->
    <div class="aura" aria-hidden="true">
        <div class="aura-layer-1"></div>
        <div class="aura-layer-2"></div>
        <div class="aura-layer-3"></div>
    </div>
    <a class="portal-link" href="../../index.html" title="Back to the portal">
        <svg viewBox="0 0 24 24"><path d="M15 5l-7 7 7 7"/></svg>Portal
    </a>
    <div class="brand-bar stats-brand">
        <img src="../../assets/logos-white.png" alt="Generalitat Valenciana · Fundació Fisabio · Imagen Biomédica e IA">
    </div>
    <div id="map_select_area">
        <div id="brain_img">
            <img class="center" src="brain.png" height="80%" />
        </div>
        <div id="radio_form">
            <div id="radio_buttons">
                <input type="radio" value="area" id="area" name="selector" checked><label for="area">Area</label><input type="radio" value="volume" id="volume" name="selector"><label for="volume">Volume</label><input type="radio" value="thickness" id="thickness" name="selector"><label for="thickness">Thickness</label>
            </div>
        </div>
        <div id="map">
        </div>

        <div style="height: 5%;"></div>
        <div id="download_button">
            <form method="get" action="data/freesurfer.zip">
               <button type="submit">Download</button>
            </form>
        </div>

    </div>
    <div id="charts">

    </div>
    <div id="select_area">
        <div id="gender">
        </div>
        <div id="ages">
        </div>

        <!--div id="modality">
            select
        </div>-->
        <script src="map.js"></script>
        <script src="donut.js"></script>
        <script src="ages_histogram.js"></script>
        <script src="part_histogram.js"></script>

        <script src="script.js"></script>


    </div>
</body>
</html>
